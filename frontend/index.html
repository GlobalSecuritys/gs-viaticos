<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="GS Viáticos — Sistema de gestión de viáticos y gastos operativos de Global Security" />
    <title>GS Viáticos | Global Security</title>

    <!-- ── Typography: Google Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- ── PWA: Manifest ── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── PWA: Tema para Android Chrome ── -->
    <meta name="theme-color" content="#0A3A60" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ── PWA: Soporte iOS (Safari "Agregar a pantalla de inicio") ── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GS Viáticos" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <!-- ── PWA: MS Tiles (Windows) ── -->
    <meta name="msapplication-TileColor" content="#0A3A60" />
    <meta name="msapplication-TileImage" content="/icon-192.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ── PWA: Registro del Service Worker ── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              console.log('[SW] Registrado OK, scope:', reg.scope);
            })
            .catch(function (err) {
              console.warn('[SW] Registro fallido:', err);
            });
        });
      }
    </script>
  </body>
</html>
