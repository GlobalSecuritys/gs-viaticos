<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo redondeado azul corporativo -->
  <rect width="512" height="512" rx="112" ry="112" fill="#0A3A60"/>
  
  <!-- Sombra interior sutil -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#grad)" opacity="0.3"/>
  
  <!-- Icono: documento de viáticos con símbolo $ -->
  <!-- Documento base -->
  <rect x="148" y="110" width="216" height="280" rx="18" ry="18" fill="white" opacity="0.95"/>
  <!-- Esquina doblada -->
  <polygon points="308,110 364,166 308,166" fill="#0A3A60" opacity="0.25"/>
  <polygon points="308,110 364,166 308,166" fill="#D0E8FF" opacity="0.8"/>

  <!-- Líneas de contenido -->
  <rect x="178" y="200" width="100" height="8" rx="4" fill="#0A3A60" opacity="0.2"/>
  <rect x="178" y="220" width="155" height="8" rx="4" fill="#0A3A60" opacity="0.15"/>
  <rect x="178" y="240" width="130" height="8" rx="4" fill="#0A3A60" opacity="0.15"/>
  <rect x="178" y="260" width="145" height="8" rx="4" fill="#0A3A60" opacity="0.15"/>

  <!-- Divider -->
  <rect x="178" y="285" width="155" height="1.5" rx="1" fill="#0A3A60" opacity="0.12"/>

  <!-- Total row -->
  <rect x="178" y="298" width="70" height="8" rx="4" fill="#0A3A60" opacity="0.2"/>
  <rect x="263" y="298" width="70" height="8" rx="4" fill="#C5A029" opacity="0.8"/>

  <!-- Círculo con signo $ en esquina inferior derecha -->
  <circle cx="348" cy="348" r="68" fill="#1D63C8"/>
  <circle cx="348" cy="348" r="60" fill="#1E40AF"/>
  <!-- Signo $ -->
  <text x="348" y="368" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="white" text-anchor="middle">$</text>

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1D63C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A3A60;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>
